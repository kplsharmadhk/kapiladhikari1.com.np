<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>For Nimika</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Mukta:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Subtle Film Grain Overlay -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Ambient Lighting Atmosphere -->
    <div class="ambient-background" aria-hidden="true">
        <div class="glow-blob blob-1"></div>
        <div class="glow-blob blob-2"></div>
        <div class="glow-blob blob-3"></div>
        <div class="stars-overlay"></div>
    </div>

    <!-- Dynamic Floating Particles -->
    <div id="particle-container" aria-hidden="true"></div>

    <!-- MAIN EXPERIENCE CONTAINER -->
    <main class="experience-container" id="app">

        <!-- FALLBACK FOR JS-DISABLED SAFETY -->
        <noscript>
            <div class="noscript-fallback">
                <h1>Nimika</h1>
                <p>आज तिमीलाई केही भन्न मन लाग्यो।</p>
                <p>I miss you, Nimika. ❤️</p>
                <p>आफ्नो ख्याल राख्नू।</p>
            </div>
        </noscript>

        <!-- SCREEN CONTAINER (Dynamically Populated by script.js) -->
        <div id="story-viewport" class="story-viewport"></div>

        <!-- FIXED BOTTOM NAVIGATION AREA -->
        <div class="bottom-action-area" id="navigation-area">
            <button class="cinematic-btn" id="next-btn" aria-label="Next Page">
                <span id="btn-text">Open this →</span>
                <div class="btn-glow"></div>
            </button>
            <span class="subtext-hint" id="btn-hint">take a little moment</span>
        </div>

    </main>

    <!-- MOBILE-ONLY PERSISTENT ROMANTIC SIGNATURE ANIMATION -->
    <div class="mobile-love-signature" id="mobile-signature" aria-hidden="true">
        <div class="mobile-orbit-small"></div>
        <div class="mobile-heart-tiny">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
