<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="surprise-page">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <section class="surprise-card">

            <div class="heart-icon">❤️</div>

            <p class="small-text">A LITTLE SOMETHING FOR YOU</p>

            <h1>
                I<br>
                <span>Miss You</span>
            </h1>

            <p class="description">
                Sometimes, words are not enough
                <br>
                to say how much I miss you.
            </p>

            <button class="open-button" onclick="openSurprise()">
                Open Surprise
                <span>✨</span>
            </button>

            <p class="hint">There's something I want to tell you... 💌</p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
