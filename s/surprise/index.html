<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You ❤️</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="surprise-page">

        <!-- Ambient background -->
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <!-- Decorative particles -->
        <div class="stars">
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>·</span>
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
        </div>

        <!-- Opening -->
        <section
            class="opening-screen"
            id="opening-screen"
        >

            <div class="opening-content">

                <p class="eyebrow">
                    A LITTLE SOMETHING
                </p>

                <div class="heart-orbit">
                    <div class="orbit-ring"></div>

                    <div class="center-heart">
                        <span>♡</span>
                    </div>
                </div>

                <h1 class="opening-title">
                    <span class="title-small">For</span>
                    <span class="title-name">Mutu</span>
                </h1>

                <p class="opening-subtitle">
                    आज तिमीलाई केही भन्न मन लाग्यो।
                </p>

                <button
                    type="button"
                    class="open-button"
                    id="open-surprise-button"
                >
                    <span>Open this</span>
                    <span class="button-arrow">→</span>
                </button>

                <p class="opening-hint">
                    take a little moment
                </p>

            </div>

        </section>

    </main>

    <script src="./script.js"></script>

</body>
</html>
