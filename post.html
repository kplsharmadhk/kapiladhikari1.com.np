<!DOCTYPE html>
<html lang="ne">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>समाचार | Kapil Adhikari</title>

    <meta name="description"
          content="Kapil Adhikari मा प्रकाशित समाचार।">

    <meta name="author"
          content="Kapil Adhikari">

    <meta name="robots"
          content="index, follow, max-image-preview:large">

    <meta name="theme-color"
          content="#111111">

    <!-- CANONICAL -->

    <link id="canonical"
          rel="canonical"
          href="https://kapiladhikari1.com.np/post.html">


    <!-- FAVICON -->

    <link rel="icon"
          type="image/png"
          href="images/favicon.png">

    <link rel="apple-touch-icon"
          href="images/favicon.png">


    <!-- OPEN GRAPH -->

    <meta property="og:type"
          content="article">

    <meta property="og:site_name"
          content="Kapil Adhikari">

    <meta property="og:locale"
          content="ne_NP">

    <meta id="ogTitle"
          property="og:title"
          content="समाचार | Kapil Adhikari">

    <meta id="ogDescription"
          property="og:description"
          content="Kapil Adhikari मा प्रकाशित समाचार।">

    <meta id="ogUrl"
          property="og:url"
          content="https://kapiladhikari1.com.np/post.html">

    <meta id="ogImage"
          property="og:image"
          content="https://kapiladhikari1.com.np/images/hero.jpg">

    <meta property="og:image:alt"
          content="Kapil Adhikari News">


    <!-- X / TWITTER -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta id="twitterTitle"
          name="twitter:title"
          content="समाचार | Kapil Adhikari">

    <meta id="twitterDescription"
          name="twitter:description"
          content="Kapil Adhikari मा प्रकाशित समाचार।">

    <meta id="twitterImage"
          name="twitter:image"
          content="https://kapiladhikari1.com.np/images/hero.jpg">


    <!-- FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #f7f5ef;
            color: #171717;

            font-family:
                "Noto Sans Devanagari",
                "DM Sans",
                sans-serif;

            line-height: 1.8;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        img {
            display: block;
            width: 100%;
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            background: #111;
            color: #fff;

            position: sticky;
            top: 0;

            z-index: 1000;

            border-bottom:
                1px solid
                rgba(255,255,255,.1);
        }


        .nav {
            max-width: 1050px;
            min-height: 76px;

            margin: auto;
            padding: 0 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }


        .brand-name {
            font-family: "DM Sans", sans-serif;

            font-size: 23px;
            font-weight: 800;

            letter-spacing: 2px;
        }


        .brand-sub {
            font-size: 10px;

            letter-spacing: 4px;

            opacity: .65;

            margin-top: 5px;
        }


        .back-link {
            border:
                1px solid
                rgba(255,255,255,.3);

            border-radius: 30px;

            padding: 9px 17px;

            font-size: 13px;

            transition: .25s;
        }


        .back-link:hover {
            background: #fff;
            color: #111;
        }


        /* =========================
           ARTICLE
        ========================== */

        .article-wrapper {
            max-width: 900px;

            margin: auto;

            padding:
                70px 22px
                100px;
        }


        .article-category {
            display: inline-block;

            color: #d02023;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 15px;
        }


        .article-title {
            font-size:
                clamp(34px, 6vw, 64px);

            line-height: 1.25;

            font-weight: 800;

            max-width: 850px;
        }


        .article-meta {
            display: flex;

            flex-wrap: wrap;

            gap: 14px;

            margin-top: 22px;

            color: #777;

            font-size: 13px;
        }


        .article-meta span {
            display: inline-flex;
            align-items: center;
        }


        .article-meta span + span::before {
            content: "•";

            margin-right: 14px;

            color: #aaa;
        }


        /* =========================
           FEATURE IMAGE
        ========================== */

        .article-image {
            margin-top: 42px;

            background: #ddd;

            overflow: hidden;
        }


        .article-image img {
            width: 100%;

            max-height: 600px;

            object-fit: cover;
        }


        /* =========================
           CONTENT
        ========================== */

        .article-content {
            max-width: 760px;

            margin:
                45px auto
                0;
        }


        .article-content p {
            font-size: 18px;

            line-height: 2;

            margin-bottom: 25px;

            color: #292929;
        }


        /* =========================
           SHARE
        ========================== */

        .share {
            max-width: 760px;

            margin:
                45px auto
                0;

            padding-top: 25px;

            border-top:
                1px solid
                #ddd;
        }


        .share-title {
            font-size: 13px;

            font-weight: 700;

            color: #777;

            margin-bottom: 12px;
        }


        .share-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 9px;
        }


        .share-btn {
            border:
                1px solid
                #d5d1c8;

            background: #fff;

            padding: 8px 14px;

            border-radius: 30px;

            font-size: 12px;

            cursor: pointer;

            transition: .25s;
        }


        .share-btn:hover {
            background: #111;

            border-color: #111;

            color: #fff;
        }


        /* =========================
           ERROR
        ========================== */

        .error {
            text-align: center;

            padding: 100px 20px;
        }


        .error h1 {
            font-size: 32px;

            margin-bottom: 10px;
        }


        .error p {
            color: #777;

            margin-bottom: 25px;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            background: #111;

            color: #fff;

            padding: 35px 22px;
        }


        .footer-inner {
            max-width: 1050px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .footer-name {
            display: block;

            font-family:
                "DM Sans",
                sans-serif;

            font-weight: 800;

            letter-spacing: 2px;
        }


        .footer-info {
            color: #888;

            font-size: 12px;

            margin-top: 4px;
        }


        .footer-copy {
            color: #888;

            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .nav {
                min-height: 68px;

                padding:
                    0 16px;
            }


            .brand-name {
                font-size: 20px;
            }


            .brand-sub {
                font-size: 9px;
            }


            .back-link {
                font-size: 11px;

                padding:
                    8px 13px;
            }


            .article-wrapper {
                padding:
                    48px 17px
                    70px;
            }


            .article-title {
                font-size: 34px;

                line-height: 1.35;
            }


            .article-meta {
                font-size: 11px;

                gap: 8px;
            }


            .article-meta span + span::before {
                margin-right: 8px;
            }


            .article-image {
                margin-top: 30px;
            }


            .article-content {
                margin-top: 32px;
            }


            .article-content p {
                font-size: 16px;

                line-height: 1.95;
            }


            .footer-inner {
                align-items: flex-start;

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================== -->

<header class="header">

    <nav class="nav">

        <a href="index.html"
           class="brand"
           aria-label="Kapil Adhikari Home">

            <span class="brand-name">
                KAPIL
            </span>

            <span class="brand-sub">
                ADHIKARI
            </span>

        </a>


        <a href="news.html"
           class="back-link">

            ← सबै समाचार

        </a>

    </nav>

</header>



<!-- =========================
     ARTICLE
========================== -->

<main>

    <article
        class="article-wrapper"
        id="article">


        <div id="articleContent">

            <!-- JavaScript ले यहाँ content राख्छ -->

        </div>


    </article>

</main>



<!-- =========================
     FOOTER
========================== -->

<footer class="footer">

    <div class="footer-inner">

        <div>

            <span class="footer-name">
                KAPIL ADHIKARI
            </span>

            <div class="footer-info">
                News • Stories • Nepal
            </div>

        </div>


        <div class="footer-copy">

            © <span id="year"></span>
            Kapil Adhikari

        </div>

    </div>

</footer>



<script>

    /* =========================
       CONFIG
    ========================== */

    const NEWS_FILE =
        "posts/posts.json";


    const SITE_URL =
        "https://kapiladhikari1.com.np";


    /* =========================
       ELEMENT
    ========================== */

    const articleContent =
        document.getElementById(
            "articleContent"
        );


    /* =========================
       SAFE TEXT
    ========================== */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       DATE
    ========================== */

    function formatDate(dateString) {

        if (!dateString) {
            return "";
        }


        const date =
            new Date(dateString);


        if (isNaN(date.getTime())) {
            return dateString;
        }


        return date.toLocaleDateString(
            "ne-NP",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

    }


    /* =========================
       GET POST ID
    ========================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const postId =
        params.get("id");


    /* =========================
       LOAD POST
    ========================== */

    async function loadPost() {

        try {

            if (!postId) {

                throw new Error(
                    "No post ID."
                );

            }


            const response =
                await fetch(
                    NEWS_FILE +
                    "?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "News file could not be loaded."
                );

            }


            const posts =
                await response.json();


            if (!Array.isArray(posts)) {

                throw new Error(
                    "Invalid news data."
                );

            }


            const post =
                posts.find(
                    item =>
                        String(item.id) ===
                        String(postId)
                );


            if (!post) {

                throw new Error(
                    "Post not found."
                );

            }


            renderPost(post);


        } catch (error) {

            console.error(
                "Post loading error:",
                error
            );


            articleContent.innerHTML = `

                <div class="error">

                    <h1>
                        समाचार भेटिएन
                    </h1>

                    <p>
                        तपाईंले खोज्नुभएको समाचार
                        उपलब्ध छैन।
                    </p>

                    <a
                        href="news.html"
                        class="back-link"
                        style="
                            display:inline-block;
                            background:#111;
                            color:#fff;
                        "
                    >
                        ← सबै समाचार
                    </a>

                </div>

            `;

        }

    }


    /* =========================
       RENDER POST
    ========================== */

    function renderPost(post) {

        const title =
            escapeHTML(
                post.title ||
                "समाचार"
            );


        const category =
            escapeHTML(
                post.categoryName ||
                "समाचार"
            );


        const author =
            escapeHTML(
                post.author ||
                "Kapil Adhikari"
            );


        const date =
            formatDate(
                post.date
            );


        const image =
            post.image ||
            "images/hero.jpg";


        const description =
            post.excerpt ||
            "Kapil Adhikari मा प्रकाशित समाचार।";


        /*
         * =========================
         * SEO
         * =========================
         */

        const pageUrl =
            SITE_URL +
            "/post.html?id=" +
            encodeURIComponent(
                post.id
            );


        const seoTitle =
            post.seoTitle ||
            post.title ||
            "समाचार | Kapil Adhikari";


        const seoDescription =
            post.seoDescription ||
            description;


        document.title =
            seoTitle;


        document
            .querySelector(
                'meta[name="description"]'
            )
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById("canonical")
            .setAttribute(
                "href",
                pageUrl
            );


        document
            .getElementById("ogTitle")
            .setAttribute(
                "content",
                seoTitle
            );


        document
            .getElementById("ogDescription")
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById("ogUrl")
            .setAttribute(
                "content",
                pageUrl
            );


        document
            .getElementById("ogImage")
            .setAttribute(
                "content",
                new URL(
                    image,
                    SITE_URL + "/"
                ).href
            );


        document
            .getElementById("twitterTitle")
            .setAttribute(
                "content",
                seoTitle
            );


        document
            .getElementById("twitterDescription")
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById("twitterImage")
            .setAttribute(
                "content",
                new URL(
                    image,
                    SITE_URL + "/"
                ).href
            );


        /*
         * =========================
         * ARTICLE CONTENT
         * =========================
         */

        let paragraphs = "";


        if (
            Array.isArray(post.content)
        ) {

            paragraphs =
                post.content
                    .map(
                        paragraph => `

                            <p>
                                ${escapeHTML(
                                    paragraph
                                )}
                            </p>

                        `
                    )
                    .join("");

        }


        articleContent.innerHTML = `

            <div class="article-category">

                ${category}

            </div>


            <h1 class="article-title">

                ${title}

            </h1>


            <div class="article-meta">

                <span>
                    ${date}
                </span>

                <span>
                    ${author}
                </span>

            </div>


            <div class="article-image">

                <img
                    src="${image}"
                    alt="${title}"
                    onerror="
                        this.src='images/hero.jpg'
                    "
                >

            </div>


            <div class="article-content">

                ${paragraphs}

            </div>


            <div class="share">

                <div class="share-title">

                    यो समाचार share गर्नुहोस्

                </div>


                <div class="share-buttons">

                    <button
                        class="share-btn"
                        onclick="shareFacebook()">

                        Facebook

                    </button>


                    <button
                        class="share-btn"
                        onclick="shareX()">

                        X

                    </button>


                    <button
                        class="share-btn"
                        onclick="copyLink()">

                        Link Copy

                    </button>

                </div>

            </div>

        `;

    }


    /* =========================
       FACEBOOK
    ========================== */

    function shareFacebook() {

        const url =
            encodeURIComponent(
                window.location.href
            );


        window.open(
            "https://www.facebook.com/sharer/sharer.php?u=" +
            url,

            "_blank",

            "width=700,height=500"
        );

    }


    /* =========================
       X
    ========================== */

    function shareX() {

        const url =
            encodeURIComponent(
                window.location.href
            );


        const text =
            encodeURIComponent(
                document.title
            );


        window.open(
            "https://twitter.com/intent/tweet?text=" +
            text +
            "&url=" +
            url,

            "_blank",

            "width=700,height=500"
        );

    }


    /* =========================
       COPY LINK
    ========================== */

    async function copyLink() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );


            alert(
                "समाचारको link copy भयो।"
            );


        } catch (error) {

            prompt(
                "यो link copy गर्नुहोस्:",
                window.location.href
            );

        }

    }


    /* =========================
       YEAR
    ========================== */

    document
        .getElementById("year")
        .textContent =
            new Date().getFullYear();


    /* =========================
       START
    ========================== */

    loadPost();

</script>


</body>
</html>
