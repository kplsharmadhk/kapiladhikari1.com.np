<!DOCTYPE html><html lang="ne">
<head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>समाचार | Kapil Adhikari</title>

<meta name="description"
      content="Kapil Adhikari मा प्रकाशित समाचार।">

<meta name="author"
      content="Kapil Adhikari">

<meta name="robots"
      content="index, follow">

<meta name="theme-color"
      content="#111111">

<link rel="icon"
      type="image/png"
      href="images/favicon.png">

<link rel="apple-touch-icon"
      href="images/favicon.png">

<!-- FONTS -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background: #f7f5ef;
        color: #171717;
        font-family:
            "Noto Sans Devanagari",
            "DM Sans",
            sans-serif;
        line-height: 1.8;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    img {
        display: block;
        width: 100%;
    }


    /* =========================
       HEADER
    ========================== */

    .header {
        background: #111;
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .nav {
        max-width: 1100px;
        min-height: 76px;
        margin: auto;
        padding: 0 22px;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand {
        display: flex;
        flex-direction: column;
        line-height: 1;
    }

    .brand-name {
        font-family: "DM Sans", sans-serif;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 2px;
    }

    .brand-sub {
        font-size: 10px;
        letter-spacing: 4px;
        opacity: .65;
        margin-top: 5px;
    }

    .back-link {
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 30px;
        padding: 9px 17px;
        font-size: 13px;
        transition: .25s;
    }

    .back-link:hover {
        background: #fff;
        color: #111;
    }


    /* =========================
       ARTICLE
    ========================== */

    .article-wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 22px 100px;
    }

    .article-category {
        display: inline-block;
        color: #d02023;
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        margin-bottom: 14px;
    }

    .article-title {
        font-size: clamp(34px, 6vw, 62px);
        line-height: 1.25;
        font-weight: 800;
        margin-bottom: 20px;
    }

    .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        color: #777;
        font-size: 13px;
        padding-bottom: 25px;
        border-bottom: 1px solid #ddd8cf;
    }

    .article-image {
        margin-top: 30px;
        background: #ddd;
        overflow: hidden;
    }

    .article-image img {
        max-height: 560px;
        object-fit: cover;
    }

    .article-content {
        max-width: 760px;
        margin: 38px auto 0;
    }

    .article-paragraph {
        font-size: 18px;
        line-height: 2;
        margin-bottom: 25px;
        color: #292929;
    }


    /* =========================
       SHARE
    ========================== */

    .share-box {
        max-width: 760px;
        margin: 45px auto 0;
        padding-top: 25px;
        border-top: 1px solid #ddd8cf;

        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .share-title {
        font-size: 13px;
        color: #777;
        margin-right: 5px;
    }

    .share-btn {
        border: 1px solid #d5d0c7;
        background: #fff;
        border-radius: 30px;
        padding: 8px 15px;
        cursor: pointer;
        font-size: 12px;
        transition: .25s;
    }

    .share-btn:hover {
        background: #111;
        color: #fff;
        border-color: #111;
    }


    /* =========================
       FOOTER
    ========================== */

    .footer {
        background: #111;
        color: #fff;
        padding: 35px 22px;
    }

    .footer-inner {
        max-width: 1100px;
        margin: auto;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .footer-name {
        display: block;
        font-family: "DM Sans", sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
    }

    .footer-info {
        color: #888;
        font-size: 12px;
        margin-top: 4px;
    }

    .footer-copy {
        color: #888;
        font-size: 12px;
    }


    /* =========================
       LOADING
    ========================== */

    .loading {
        text-align: center;
        padding: 100px 20px;
        color: #777;
    }

    .loading strong {
        display: block;
        color: #222;
        font-size: 20px;
        margin-bottom: 8px;
    }


    /* =========================
       ERROR
    ========================== */

    .error-box {
        text-align: center;
        padding: 100px 20px;
    }

    .error-box h1 {
        font-size: 32px;
        margin-bottom: 12px;
    }

    .error-box p {
        color: #777;
        margin-bottom: 25px;
    }

    .error-home {
        display: inline-block;
        background: #111;
        color: #fff;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

        .nav {
            min-height: 68px;
            padding: 0 16px;
        }

        .brand-name {
            font-size: 20px;
        }

        .back-link {
            font-size: 11px;
            padding: 8px 13px;
        }

        .article-wrapper {
            padding: 42px 17px 75px;
        }

        .article-title {
            font-size: 34px;
        }

        .article-meta {
            font-size: 11px;
            gap: 10px;
        }

        .article-content {
            margin-top: 30px;
        }

        .article-paragraph {
            font-size: 16px;
            line-height: 2;
        }

        .article-image {
            margin-top: 25px;
        }

        .footer-inner {
            align-items: flex-start;
            flex-direction: column;
        }

    }

</style>

</head><body><!-- =========================
     HEADER
========================== --><header class="header"><div class="nav">

    <a href="index.html"
       class="brand"
       aria-label="Kapil Adhikari Home">

        <span class="brand-name">
            KAPIL
        </span>

        <span class="brand-sub">
            ADHIKARI
        </span>

    </a>


    <a href="news.html"
       class="back-link">

        ← सबै समाचार

    </a>

</div>

</header><!-- =========================
     MAIN
========================== --><main id="mainContent"><div class="loading">

    <strong>
        समाचार लोड हुँदैछ...
    </strong>

    कृपया केही क्षण पर्खनुहोस्।

</div>

</main><!-- =========================
     FOOTER
========================== --><footer class="footer"><div class="footer-inner">

    <div>

        <span class="footer-name">
            KAPIL ADHIKARI
        </span>

        <div class="footer-info">
            News • Stories • Nepal
        </div>

    </div>


    <div class="footer-copy">

        © <span id="year"></span>
        Kapil Adhikari

    </div>

</div>

</footer><script>

    /* =========================
       NEWS FILE
    ========================== */

    const NEWS_FILE = "posts/posts.json";


    const mainContent =
        document.getElementById(
            "mainContent"
        );


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       DATE
    ========================== */

    function formatDate(dateString) {

        if (!dateString) {
            return "";
        }

        const date =
            new Date(dateString);

        if (isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleDateString(
            "ne-NP",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

    }


    /* =========================
       GET POST ID
    ========================== */

    function getPostId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("id");

    }


    /* =========================
       LOAD POST
    ========================== */

    async function loadPost() {

        const postId =
            getPostId();


        if (!postId) {

            showError(
                "समाचार भेटिएन",
                "समाचार खोल्नका लागि सही link आवश्यक छ।"
            );

            return;

        }


        try {

            const response =
                await fetch(
                    NEWS_FILE +
                    "?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "News file could not be loaded."
                );

            }


            const posts =
                await response.json();


            if (!Array.isArray(posts)) {

                throw new Error(
                    "Invalid news data."
                );

            }


            const post =
                posts.find(
                    item =>
                        String(item.id) ===
                        String(postId)
                );


            if (!post) {

                showError(
                    "समाचार भेटिएन",
                    "तपाईंले खोज्नुभएको समाचार उपलब्ध छैन।"
                );

                return;

            }


            renderPost(post);


        } catch (error) {

            console.error(
                "Post loading error:",
                error
            );


            showError(
                "समाचार लोड हुन सकेन",
                "कृपया केही समयपछि फेरि प्रयास गर्नुहोस्।"
            );

        }

    }


    /* =========================
       RENDER POST
    ========================== */

    function renderPost(post) {

        const title =
            escapeHTML(
                post.title ||
                "शीर्षक छैन"
            );


        const category =
            escapeHTML(
                post.categoryName ||
                "समाचार"
            );


        const author =
            escapeHTML(
                post.author ||
                "Kapil Adhikari"
            );


        const date =
            formatDate(
                post.date
            );


        const image =
            post.image ||
            "images/hero.jpg";


        let paragraphs = "";


        if (
            Array.isArray(
                post.content
            )
        ) {

            paragraphs =
                post.content
                    .map(
                        paragraph => `

                            <p class="article-paragraph">

                                ${escapeHTML(
                                    paragraph
                                )}

                            </p>

                        `
                    )
                    .join("");

        } else {

            paragraphs = `

                <p class="article-paragraph">

                    ${escapeHTML(
                        post.content || ""
                    )}

                </p>

            `;

        }


        document.title =
            title +
            " | Kapil Adhikari";


        const metaDescription =
            document.querySelector(
                'meta[name="description"]'
            );


        if (metaDescription) {

            metaDescription.setAttribute(
                "content",
                post.seoDescription ||
                post.excerpt ||
                title
            );

        }


        mainContent.innerHTML = `

            <article class="article-wrapper">

                <span class="article-category">

                    ${category}

                </span>


                <h1 class="article-title">

                    ${title}

                </h1>


                <div class="article-meta">

                    <span>
                        ${date}
                    </span>

                    <span>
                        लेखक: ${author}
                    </span>

                </div>


                <div class="article-image">

                    <img
                        src="${image}"
                        alt="${title}"
                        onerror="this.src='images/hero.jpg'"
                    >

                </div>


                <div class="article-content">

                    ${paragraphs}

                </div>


                <div class="share-box">

                    <span class="share-title">
                        शेयर गर्नुहोस्:
                    </span>


                    <button
                        class="share-btn"
                        onclick="shareFacebook()">

                        Facebook

                    </button>


                    <button
                        class="share-btn"
                        onclick="shareX()">

                        X

                    </button>


                    <button
                        class="share-btn"
                        onclick="copyLink()">

                        Link Copy

                    </button>

                </div>

            </article>

        `;

    }


    /* =========================
       ERROR
    ========================== */

    function showError(
        title,
        message
    ) {

        mainContent.innerHTML = `

            <div class="error-box">

                <h1>
                    ${escapeHTML(title)}
                </h1>

                <p>
                    ${escapeHTML(message)}
                </p>

                <a
                    href="news.html"
                    class="error-home">

                    ← समाचारमा फर्कनुहोस्

                </a>

            </div>

        `;

    }


    /* =========================
       FACEBOOK SHARE
    ========================== */

    function shareFacebook() {

        const url =
            encodeURIComponent(
                window.location.href
            );


        window.open(
            "https://www.facebook.com/sharer/sharer.php?u=" +
            url,
            "_blank",
            "width=700,height=500"
        );

    }


    /* =========================
       X SHARE
    ========================== */

    function shareX() {

        const url =
            encodeURIComponent(
                window.location.href
            );


        const text =
            encodeURIComponent(
                document.title
            );


        window.open(
            "https://twitter.com/intent/tweet?url=" +
            url +
            "&text=" +
            text,
            "_blank",
            "width=700,height=500"
        );

    }


    /* =========================
       COPY LINK
    ========================== */

    async function copyLink() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );


            alert(
                "समाचारको link copy भयो।"
            );

        } catch (error) {

            alert(
                "Link copy गर्न सकिएन।"
            );

        }

    }


    /* =========================
       FOOTER YEAR
    ========================== */

    document
        .getElementById("year")
        .textContent =
            new Date().getFullYear();


    /* =========================
       START
    ========================== */

    loadPost();

</script></body>
</html>
