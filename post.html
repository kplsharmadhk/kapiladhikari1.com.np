<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{

background:#f7f5ef;

color:#171717;

font-family:
"Noto Sans Devanagari",
"DM Sans",
sans-serif;

line-height:1.8;

}

a{
color:inherit;
text-decoration:none;
}

img{
display:block;
width:100%;
}


/* =========================
   HEADER
========================= */

.header{

background:#111;

color:#fff;

position:sticky;

top:0;

z-index:1000;

border-bottom:
1px solid
rgba(255,255,255,.1);

}

.nav{

max-width:1050px;

min-height:76px;

margin:auto;

padding:0 22px;

display:flex;

justify-content:space-between;

}

.brand{

display:flex;

flex-direction:column;

}

.brand-name{

font-family:"DM Sans",sans-serif;

font-size:23px;

font-weight:800;

letter-spacing:2px;

}

.brand-sub{

font-size:10px;

letter-spacing:4px;

opacity:.65;

margin-top:5px;

}

.back-link{

border:
1px solid
rgba(255,255,255,.3);

border-radius:30px;

padding:9px 17px;

font-size:13px;

transition:.25s;

}

.back-link:hover{

background:#fff;

color:#111;

}


/* =========================
   ARTICLE
========================= */

.article-wrapper{

max-width:900px;

margin:auto;

padding:
65px 22px
100px;

}

.article-category{

display:inline-block;

color:#d02023;

font-family:
"DM Sans",
sans-serif;

font-size:12px;

font-weight:800;

letter-spacing:1.5px;

margin-bottom:14px;

}

.article-title{

font-size:
clamp(34px,6vw,64px);

line-height:1.25;

font-weight:800;

letter-spacing:-1px;

}

.article-meta{

display:flex;

flex-wrap:wrap;

gap:18px;

margin-top:18px;

padding-bottom:25px;

color:#777;

font-size:12px;

border-bottom:
1px solid #ddd;

}

.article-image{

margin-top:30px;

overflow:hidden;

background:#ddd;

}

.article-image img{

width:100%;

max-height:600px;

object-fit:cover;

}

.article-content{

margin-top:35px;

}

.article-content p{

font-size:17px;

line-height:2;

margin-bottom:23px;

color:#303030;

}


/* =========================
   READ MESSAGE
========================= */

.read-message{

margin-top:35px;

margin-bottom:25px;

padding:18px 20px;

background:#fff;

border-left:
4px solid #d02023;

font-size:15px;

font-weight:600;

color:#333;

}


/* =========================
   SHARE
========================= */

.share{

margin-top:50px;

padding-top:25px;

border-top:
1px solid #ddd;

}

.share-title{

font-size:14px;

font-weight:700;

margin-bottom:14px;

}

.share-buttons{

display:flex;

flex-wrap:wrap;

gap:9px;

}

.share-btn{

border:1px solid #ccc;

background:#fff;

padding:9px 16px;

border-radius:25px;

cursor:pointer;

font-size:12px;

transition:.25s;

}

.share-btn:hover{

background:#111;

color:#fff;

border-color:#111;

}


/* =========================
   FOOTER
========================= */

.footer{

background:#111;

color:#fff;

padding:35px 22px;

}

.footer-inner{

max-width:1050px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

}

.footer-name{

font-family:"DM Sans",sans-serif;

font-weight:800;

letter-spacing:2px;

}

.footer-info{

color:#888;

font-size:12px;

margin-top:4px;

}

.footer-copy{

color:#888;

font-size:12px;

}


/* =========================
   ERROR
========================= */

.error{

text-align:center;

padding:100px 20px;

}

.error h1{

font-size:32px;

margin-bottom:10px;

}

.error p{

color:#777;

margin-bottom:25px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.nav{

min-height:68px;

padding:0 16px;

}

.brand-name{

font-size:20px;

}

.back-link{

font-size:11px;

padding:8px 13px;

}

.article-wrapper{

padding:
45px 17px
75px;

}

.article-title{

font-size:34px;

letter-spacing:-.5px;

}

.article-content p{

font-size:16px;

line-height:1.9;

}

.article-image img{

max-height:450px;

}

.footer-inner{

align-items:flex-start;

flex-direction:column;

}

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

<div class="nav">

<a href="index.html"
   class="brand">

<span class="brand-name">
KAPIL
</span>

<span class="brand-sub">
ADHIKARI
</span>

</a>


<a href="news.html"
   class="back-link">

← समाचारहरू

</a>

</div>

</header>


<!-- =========================
     ARTICLE
========================= -->

<main>

<div
class="article-wrapper"
id="articleWrapper">

<div style="text-align:center;padding:80px 20px;">

समाचार लोड हुँदैछ...

</div>

</div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

<div class="footer-inner">

<div>

<div class="footer-name">
KAPIL ADHIKARI
</div>

<div class="footer-info">
News • Stories • Nepal
</div>

</div>


<div class="footer-copy">

©
<span id="year"></span>
Kapil Adhikari

</div>

</div>

</footer>


<script>

/* =========================
   SETTINGS
========================= */

const NEWS_FILE =
"posts/posts.json";

const SITE_URL =
"https://kapiladhikari1.com.np";


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   DATE
========================= */

function formatDate(dateString){

if(!dateString)
return "";

const date =
new Date(dateString);

if(
isNaN(date.getTime())
){

return dateString;

}

return date.toLocaleDateString(
"ne-NP",
{

year:"numeric",

month:"long",

day:"numeric"

}
);

}


/* =========================
   GET ID
========================= */

const params =
new URLSearchParams(
window.location.search
);

const postId =
params.get("id");


/* =========================
   LOAD NEWS
========================= */

async function loadPost(){

const wrapper =
document.getElementById(
"articleWrapper"
);


try{


if(!postId){

throw new Error(
"समाचार भेटिएन।"
);

}


const response =
await fetch(
NEWS_FILE +
"?v=" +
Date.now()
);


if(!response.ok){

throw new Error(
"समाचार फाइल लोड हुन सकेन।"
);

}


const posts =
await response.json();


if(!Array.isArray(posts)){

throw new Error(
"समाचार data गलत छ।"
);

}


const post =
posts.find(
item =>
String(item.id) ===
String(postId)
);


if(!post){

throw new Error(
"यो समाचार भेटिएन।"
);

}


/* =========================
   DATA
========================= */

const title =
post.title ||
"समाचार";

const category =
post.categoryName ||
"समाचार";

const author =
post.author ||
"Kapil Adhikari";

const date =
formatDate(post.date);

const image =
post.image ||
"images/hero.jpg";

const excerpt =
post.excerpt ||
"विस्तृतमा समाचार पढ्नुहोस्।";


/* =========================
   IMAGE URL
========================= */

const absoluteImage =
new URL(
image,
SITE_URL + "/"
).href;


/* =========================
   PAGE URL
========================= */

const pageUrl =
window.location.href;


/* =========================
   SEO
========================= */

const seoTitle =
post.seoTitle ||
title +
" | Kapil Adhikari";

const seoDescription =
post.seoDescription ||
excerpt;


/* =========================
   DOCUMENT TITLE
========================= */

document.title =
seoTitle;


/* =========================
   META UPDATE
========================= */

document
.getElementById("canonical")
.setAttribute(
"href",
pageUrl
);


document
.getElementById("ogTitle")
.setAttribute(
"content",
seoTitle
);


document
.getElementById("ogDescription")
.setAttribute(
"content",
seoDescription
);


document
.getElementById("ogUrl")
.setAttribute(
"content",
pageUrl
);


document
.getElementById("ogImage")
.setAttribute(
"content",
absoluteImage
);


document
.getElementById("twitterTitle")
.setAttribute(
"content",
seoTitle
);


document
.getElementById("twitterDescription")
.setAttribute(
"content",
seoDescription
);


document
.getElementById("twitterImage")
.setAttribute(
"content",
absoluteImage
);


/* =========================
   CONTENT
========================= */

let paragraphs = "";


if(
Array.isArray(post.content)
){

paragraphs =
post.content

.map(
paragraph => `

<p>
${escapeHTML(paragraph)}
</p>

`
)

.join("");

}


/* =========================
   ARTICLE HTML
========================= */

wrapper.innerHTML = `

<div class="article-category">

${escapeHTML(category)}

</div>


<h1 class="article-title">

${escapeHTML(title)}

</h1>


<div class="article-meta">

<span>
${escapeHTML(date)}
</span>

<span>
${escapeHTML(author)}
</span>

</div>


<div class="article-image">

<img
src="${escapeHTML(absoluteImage)}"
alt="${escapeHTML(title)}"
fetchpriority="high"
onerror="
this.src='images/hero.jpg'
">

</div>


<div class="read-message">

विस्तृतमा समाचार पढ्नुहोस्।

</div>


<div class="article-content">

${paragraphs}

</div>


<div class="share">

<div class="share-title">

यो समाचार share गर्नुहोस्

</div>


<div class="share-buttons">


<button
class="share-btn"
onclick="shareFacebook()">

Facebook

</button>


<button
class="share-btn"
onclick="shareX()">

X

</button>


<button
class="share-btn"
onclick="copyLink()">

Link Copy

</button>


</div>

</div>

`;



}catch(error){


console.error(error);


wrapper.innerHTML = `

<div class="error">

<h1>
समाचार भेटिएन
</h1>

<p>
समाचार लोड गर्दा समस्या भयो।
</p>

<a
href="news.html"
class="back-link"
style="display:inline-block;background:#111;color:#fff;">

← समाचारमा फर्कनुहोस्

</a>

</div>

`;

}

}


/* =========================
   FACEBOOK
========================= */

function shareFacebook(){

const url =
encodeURIComponent(
window.location.href
);

window.open(

"https://www.facebook.com/sharer/sharer.php?u=" +
url,

"_blank",

"width=700,height=500"

);

}


/* =========================
   X
========================= */

function shareX(){

const url =
encodeURIComponent(
window.location.href
);

const text =
encodeURIComponent(
document.title
);

window.open(

"https://twitter.com/intent/tweet?text=" +
text +
"&url=" +
url,

"_blank",

"width=700,height=500"

);

}


/* =========================
   COPY LINK
========================= */

async function copyLink(){

try{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"समाचारको link copy भयो।"
);

}catch(error){

prompt(
"यो link copy गर्नुहोस्:",
window.location.href
);

}

}


/* =========================
   YEAR
========================= */

document
.getElementById("year")
.textContent =
new Date().getFullYear();


/* =========================
   START
========================= */

loadPost();

</script>

</body>

</html>
