<style>

/* =========================

.header{

    1px solid

/* =========================
   READ MORE NOTE
========================= */

.read-more-note{

    padding:18px 20px;

    background:#fff;

    border-left:
    4px solid

    border-right:1px solid #e5e1d9;
    border-bottom:1px solid #e5e1d9;

    color:#444;

}


/* =========================

========================= */

    padding-top:25px;

    border-top:1px solid #ddd;

}

/* =========================
   ERROR
========================= */

.error{
    text-align:center;

    padding:
    100px 20px;
}

.error h1{

/* =========================
   FOOTER
========================= */

    color:#fff;

.footer-inner{

    margin:auto;

}

.footer-name{
    display:block;

    font-family:"DM Sans",sans-serif;

    font-weight:800;

    letter-spacing:2px;
}

.footer-info{
    color:#888;

    font-size:11px;

    margin-top:5px;
}

    color:#888;

    font-size:11px;

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .nav{
        min-height:68px;

        padding:0 16px;
    }

        font-size:20px;
    }

    .back-link{
        font-size:11px;

        padding:8px 13px;
    }

    .article-wrapper{
        padding:
        45px 17px
        70px;
    }

    .article-title{
        font-size:34px;

        line-height:1.35;
    }

    .article-meta{
        font-size:11px;

        gap:12px;
    }

    .article-content{
        margin-top:28px;
    }

    .article-content p{
        font-size:15px;

        line-height:1.95;
    }

    .article-image{
        margin-top:24px;
    }

    .share-buttons{
        gap:8px;
    }

    .share-btn{
        padding:8px 13px;
    }

    .footer-inner{
        align-items:flex-start;

        flex-direction:column;
    }

}

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="nav">

        <a href="index.html"
           class="brand"
           aria-label="Kapil Adhikari Home">

            <span class="brand-name">
                KAPIL
            </span>

            <span class="brand-sub">
                ADHIKARI
            </span>

        </a>


        <a href="news.html"
           class="back-link">

            ← समाचार

        </a>

    </div>

</header>



<!-- =========================
     ARTICLE
========================= -->

<main>

<section class="article-wrapper"
         id="articleWrapper">


    <div id="articleContent">

        <div class="error">

            समाचार लोड हुँदैछ...

        </div>

    </div>


</section>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-inner">

        <div>

            <span class="footer-name">
                KAPIL ADHIKARI
            </span>

            <div class="footer-info">
                News • Stories • Nepal
            </div>

        </div>


        <div class="footer-copy">

            ©
            <span id="year"></span>
            Kapil Adhikari

        </div>

    </div>

</footer>



<script>

/* =========================
   SETTINGS
========================= */

const NEWS_FILE =
    "posts/posts.json";

const SITE_URL =
    "https://kapiladhikari1.com.np";


const articleContent =
    document.getElementById(
        "articleContent"
    );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(dateString){

    if(!dateString){
        return "";
    }

    const date =
        new Date(dateString);

    if(
        isNaN(
            date.getTime()
        )
    ){
        return dateString;
    }

    return date.toLocaleDateString(
        "ne-NP",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =========================
   GET POST ID
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const postId =
    params.get("id");


/* =========================
   LOAD POST
========================= */

async function loadPost(){

    try{

        if(!postId){

            throw new Error(
                "No post ID."
            );

        }


        const response =
            await fetch(
                NEWS_FILE +
                "?v=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "News file could not be loaded."
            );

        }


        const posts =
            await response.json();


        if(!Array.isArray(posts)){

            throw new Error(
                "Invalid news data."
            );

        }


        const post =
            posts.find(
                item =>
                String(item.id) ===
                String(postId)
            );


        if(!post){

            throw new Error(
                "News not found."
            );

        }


        /* =========================
           DATA
        ========================= */

        const title =
            post.title ||
            "समाचार";

        const category =
            post.categoryName ||
            "समाचार";

        const author =
            post.author ||
            "Kapil Adhikari";

        const date =
            formatDate(
                post.date
            );

        const image =
            post.image ||
            "images/hero.jpg";

        const seoTitle =
            post.seoTitle ||
            title +
            " | Kapil Adhikari";

        const seoDescription =
            "विस्तृतमा पढ्न यहाँ क्लिक गर्नुहोस्।";


        /* =========================
           IMAGE URL
        ========================= */

        const imageURL =
            new URL(
                image,
                SITE_URL + "/"
            ).href;


        /* =========================
           PAGE URL
        ========================= */

        const pageURL =
            SITE_URL +
            "/post.html?id=" +
            encodeURIComponent(
                post.id
            );


        /* =========================
           BROWSER SEO
        ========================= */

        document.title =
            seoTitle;


        document
            .getElementById(
                "metaDescription"
            )
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById(
                "canonical"
            )
            .setAttribute(
                "href",
                pageURL
            );


        /* =========================
           OPEN GRAPH
        ========================= */

        document
            .getElementById(
                "ogTitle"
            )
            .setAttribute(
                "content",
                seoTitle
            );


        document
            .getElementById(
                "ogDescription"
            )
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById(
                "ogUrl"
            )
            .setAttribute(
                "content",
                pageURL
            );


        document
            .getElementById(
                "ogImage"
            )
            .setAttribute(
                "content",
                imageURL
            );


        /* =========================
           X / TWITTER
        ========================= */

        document
            .getElementById(
                "twitterTitle"
            )
            .setAttribute(
                "content",
                seoTitle
            );


        document
            .getElementById(
                "twitterDescription"
            )
            .setAttribute(
                "content",
                seoDescription
            );


        document
            .getElementById(
                "twitterImage"
            )
            .setAttribute(
                "content",
                imageURL
            );


        /* =========================
           ARTICLE PARAGRAPHS
        ========================= */

        let paragraphs = "";


        if(
            Array.isArray(
                post.content
            )
        ){

            paragraphs =
                post.content
                    .map(
                        paragraph => `
                            <p>
                                ${escapeHTML(
                                    paragraph
                                )}
                            </p>
                        `
                    )
                    .join("");

        }


        /* =========================
           ARTICLE HTML
        ========================= */

        articleContent.innerHTML = `

            <div class="article-category">

                ${escapeHTML(
                    category
                )}

            </div>


            <h1 class="article-title">

                ${escapeHTML(
                    title
                )}

            </h1>


            <div class="article-meta">

                <span>
                    ${escapeHTML(
                        date
                    )}
                </span>

                <span>
                    ${escapeHTML(
                        author
                    )}
                </span>

            </div>


            <div class="article-image">

                <img
                    src="${escapeHTML(
                        image
                    )}"
                    alt="${escapeHTML(
                        title
                    )}"
                    onerror="
                        this.src='images/hero.jpg';
                    "
                >

            </div>


            <div class="article-content">

                ${paragraphs}

            </div>


            <div class="read-more-note">

                विस्तृतमा पढ्न यहाँ क्लिक गर्नुहोस्।

            </div>


            <div class="share">

                <div class="share-title">

                    यो समाचार share गर्नुहोस्

                </div>


                <div class="share-buttons">

                    <button
                        class="share-btn"
                        onclick="shareFacebook()">

                        Facebook

                    </button>


                    <button
                        class="share-btn"
                        onclick="shareX()">

                        X

                    </button>


                    <button
                        class="share-btn"
                        onclick="copyLink()">

                        Link Copy

                    </button>

                </div>

            </div>

        `;

    }

    catch(error){

        console.error(
            "News loading error:",
            error
        );


        articleContent.innerHTML = `

            <div class="error">

                <h1>
                    समाचार भेटिएन
                </h1>

                <p>
                    यो समाचार उपलब्ध छैन
                    वा link गलत छ।
                </p>

                <a href="news.html">
                    ← समाचारमा फर्कनुहोस्
                </a>

            </div>

        `;

    }

}


/* =========================
   FACEBOOK SHARE
========================= */

function shareFacebook(){

    const url =
        encodeURIComponent(
            window.location.href
        );

    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        url,

        "_blank",

        "width=700,height=500"
    );

}


/* =========================
   X SHARE
========================= */

function shareX(){

    const url =
        encodeURIComponent(
            window.location.href
        );

    const text =
        encodeURIComponent(
            document.title
        );

    window.open(
        "https://twitter.com/intent/tweet?text=" +
        text +
        "&url=" +
        url,

        "_blank",

        "width=700,height=500"
    );

}


/* =========================
   COPY LINK
========================= */

async function copyLink(){

    try{

        await navigator.clipboard.writeText(
            window.location.href
        );

        alert(
            "समाचारको link copy भयो।"
        );

    }

    catch(error){

        prompt(
            "यो link copy गर्नुहोस्:",
            window.location.href
        );

    }

}


/* =========================
   YEAR
========================= */

document
    .getElementById("year")
    .textContent =
        new Date().getFullYear();


/* =========================
   START
========================= */

loadPost();

</script>


</body>
</html>
