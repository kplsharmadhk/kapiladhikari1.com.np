<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login | Kapil Sharma Adhikari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-panel">
      <div class="brand-mark">KSA</div>
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>Welcome back.</h1>
      <p class="intro">Sign in to manage your website and journalism content.</p>

      <form id="loginForm" autocomplete="off">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required>

        <button type="submit">Sign in <span>→</span></button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>

      <a class="back-link" href="../">← Back to website</a>
    </section>

    <aside class="visual-panel">
      <div class="visual-content">
        <span>Kapil Sharma Adhikari</span>
        <h2>Manage your digital presence from one place.</h2>
        <p>Website · News · Portfolio · Profile</p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
